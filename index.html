<style>

<script>

function mode(m){S.mode=m;render();scrollTo(0,0)}
function render(){$("#app").innerHTML=topbar()+(S.mode=="client"?client():master());
$("#app").insertAdjacentHTML("beforeend",S.mode=="master"?`<nav class="nav"><div>${[["cal","Календар",'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4m8-4v4M3 9h18"/>'],["cl","Клієнтки",'<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0m2-13a4 4 0 0 1 0 8m1 2a6 6 0 0 1 3 5"/>'],"+",["rq","Запити",'<path d="M4 13l2-8h12l2 8v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/>'],["st","Налаштування",'<path d="M4 7h10m4 0h2M4 17h2m4 0h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>']].map(x=>x=="+"?`<button class="fab" aria-label="Новий запис" onclick="quick()">＋</button>`:`<button class="${S.tab==x[0]?"on":""}" onclick="S.tab='${x[0]}';render()"><svg viewBox="0 0 24 24">${x[2]}</svg>${x[1]}${x[0]=="rq"&&pend()?`<i class="bdg">${pend()}</i>`:""}</button>`).join("")}</div></nav>`:cnav())}
/* ---------- CLIENT ---------- */
function client(){if(S.ct=='prof')return profV();const s=S.sel,st=S.step;
const bar=`<div class="steps">${[1,2,3].map(i=>`<i class="${i<=Math.min(st,3)&&st<4?"on":st==4?"on":""}"></i>`).join("")}</div>`;
if(st==1)return `<h1>Обери свою послугу</h1><p class="mu">Запис займе хвилину, реєстрація не потрібна.</p>${bar}
${rep()}
${SV.filter(x=>!x.off).map(x=>`<button class="card svc" onclick="pick(${x.id})"><span><b>${esc(x.n)}</b>${x.desc?`<span class="sm mu" style="display:block">${esc(x.desc)}</span>`:""}<span class="sm mu">${x.d} хв</span></span><span class="price">${x.p} ₴</span></button>`).join("")}`;
if(st==2){const v=sv(s.svc),sl=slots(s.day,v.d),free=sl.filter(x=>x.f).length;
return `<button class="back" onclick="S.step=1;render()">← Послуги</button><h1>Коли тобі зручно?</h1>${bar}<p class="mu sm">${v.n} · ${v.d} хв · ${v.p} ₴</p>
<div class="days">${[...Array(14)].map((_,i)=>i+0).slice(0,14).map(o=>{const off=isOff(o),n=slots(o,v.d).filter(x=>x.f).length;return `<button class="day ${s.day==o?"on":""}" ${off?"disabled":""} onclick="S.sel.day=${o};S.sel.time=null;render()"><span>${WD[D(o).getDay()]}</span><b>${D(o).getDate()}</b>${!off&&n==0?"<i></i>":""}</button>`}).join("")}</div>
<h2>${wd(s.day)}, ${fd(s.day)}</h2>
${sl.length?`<div class="slots">${sl.map(x=>`<button class="slot ${s.time==x.t?"on":""}" ${x.f?"":"disabled"} onclick="S.sel.time='${x.t}';render()">${x.t}</button>`).join("")}</div>`:`<div class="brk">Вихідний. Оберіть інший день.</div>`}
${sl.length&&free<3?`<p class="sm mu">Вільних вікон майже немає.</p>`:""}
<button class="btn g" onclick="waitSheet()">Потрібного часу немає — стати в чергу</button>
<button class="btn" ${s.time?"":"disabled"} onclick="S.step=3;render()">Далі</button>`}
if(st==3){const v=sv(s.svc);return `<button class="back" onclick="S.step=2;render()">← Дата й час</button><h1>Як до тебе звертатися?</h1>${bar}
<div class="card"><b>${v.n}</b><div class="sm mu">${wd(s.day)}, ${fd(s.day)} о ${s.time} · ${v.d} хв</div></div>
<label class="f">Ім’я</label><input id="nm" value="${esc(s.name||(S.prof?S.prof.name:''))}" autocomplete="name">
<label class="f">Телефон</label><input id="ph" type="tel" value="${esc(s.phone||(S.prof?S.prof.phone:''))}" placeholder="+380" autocomplete="tel">
<label class="f">Коментар (за бажанням)</label><textarea id="cm">${esc(s.comment)}</textarea>
<label class="f">Оплата</label><div class="pay"><button class="${s.pay=="cash"?"on":""}" onclick="sv2();S.sel.pay='cash';render()">Готівка</button><button class="${s.pay=="card"?"on":""}" onclick="sv2();S.sel.pay='card';render()">Переказ на картку</button></div>
${S.prof?'':'<label class="row2 sm" style="justify-content:flex-start;gap:10px;margin-top:12px"><input id="rm" type="checkbox" style="width:20px;height:20px"> Запам’ятати мої дані для наступних записів</label>'}
<div class="row2" style="margin-top:14px"><span class="mu">До сплати</span><b>${v.p} ₴</b></div>
<button class="btn" onclick="book()">Підтвердити запис</button>`}
const a=S.last,v=sv(a.svc);return `<div class="ok">✓</div><h1>Ти записана, ${esc(a.name.split(" ")[0])}!</h1><p class="mu">Нагадаю в Telegram за годину до візиту.</p>
<div class="card"><b>${v.n}</b><div>${wd(a.o)}, ${fd(a.o)} о ${a.time}</div><div class="sm mu">${v.d} хв · ${v.p} ₴ · ${a.pay=="cash"?"готівка":"переказ на картку"}</div><hr style="border:0;border-top:1px solid var(--ln)"><div class="sm">${esc(a.name)}, ${esc(a.phone)}</div>${a.cm?`<div class="sm mu">«${esc(a.cm)}»</div>`:""}</div>
<button class="btn g" onclick="toast('Додано в календар (демо)')">Додати до мого календаря</button>
<button class="btn" onclick="S.mode='master';S.tab='cal';S.day=${a.o};render()">Подивитись у кабінеті майстра</button>
<button class="back" style="margin-top:8px" onclick="S.step=1;S.sel={svc:null,day:1,time:null,name:'',phone:'',comment:'',pay:'cash'};render()">Новий запис</button>`}
function pick(id){S.sel.svc=id;S.sel.time=null;S.step=2;render()}
function repeat(id){Object.assign(S.sel,{svc:id,name:S.prof.name,phone:S.prof.phone,time:null});S.step=2;render();toast('Дані підставлено — оберіть нову дату')}
function sv2(){S.sel.name=$("#nm").value;S.sel.phone=$("#ph").value;S.sel.comment=$("#cm").value}
function book(){sv2();const s=S.sel;if(!s.name.trim()||s.phone.replace(/\D/g,"").length<10){toast("Вкажіть ім’я та телефон повністю");return}
if(!S.prof&&$("#rm")&&$("#rm").checked)S.prof={name:s.name.trim(),phone:s.phone,email:""};
const a={id:S.id++,o:s.day,time:s.time,svc:s.svc,name:s.name.trim(),phone:s.phone,st:"new",paid:false,note:"",cm:s.comment,pay:s.pay,cat:Date.now(),client:true};S.appts.push(a);S.last=a;S.step=4;render();scrollTo(0,0)}
function waitSheet(){const s=S.sel;sheet(`<h2>Список очікування</h2><p class="mu sm">Майстер сама вирішить, кому запропонувати вільне вікно.</p>
<label class="f">Бажана дата</label><select id="wo">${[...Array(14)].map((_,o)=>!isOff(o)?`<option value="${o}" ${o==s.day?"selected":""}>${wd(o)}, ${fd(o)}</option>`:"").join("")}</select>
<label class="f">Час</label><select id="wr"><option>будь-який час</option><option>до 13:00</option><option>після 15:00</option></select>
<label class="f">Ім’я</label><input id="wn" value="${esc(s.name)}"><label class="f">Телефон</label><input id="wp" type="tel" value="${esc(s.phone)}" placeholder="+380">
<button class="btn" onclick="addWait()">Залишити заявку</button>`)}
function addWait(){const n=$("#wn").value.trim();if(!n){toast("Вкажіть ім’я");return}S.wait.push({id:S.id++,name:n,phone:$("#wp").value,o:+$("#wo").value,rng:$("#wr").value});closeS();toast("Заявку додано до списку очікування")}
/* ---------- MASTER ---------- */
function master(){return S.tab=="cal"?cal():S.tab=="cl"?clients():S.tab=="rq"?reqs():S.tab=="st"?stg():cal()}
function stg(){const t=S.sset||'sv';return `<h1>Налаштування</h1><div class="seg vw">${[['sv','Послуги'],['rm','Нагадування']].map(v=>`<button class="${t==v[0]?'on':''}" onclick="S.sset='${v[0]}';render()">${v[1]}</button>`).join('')}</div>`+(t=='sv'?svcs():rem())}
function pend(){return S.reqs.filter(r=>r.st=='pending').length}
function pl(n,a,b,c){const m=n%10,h=n%100;return h>10&&h<20?c:m==1?a:m>1&&m<5?b:c}
function cr(m){const d=new Date(Date.now()-m*6e4),n=new Date(),t=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),y=Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);return(y<1?'Сьогодні':y==1?'Вчора':d.getDate()+' '+MN[d.getMonth()])+', '+t}
function dl(o,t){return wd(o)+', '+fd(o)+' · '+t}
function rqOk(r){const a=r.type=='move'?S.appts.find(x=>x.id==r.aid):null;if(r.type=='move'&&(!a||a.st=='canc'))return 'gone';const d=sv(r.svc).d,s=t2m(r.t);if(isOff(r.o)||s<540||s+d>1200)return 'busy';return busy(r.o,a?a.id:-1).some(b=>s<b[1]&&s+d>b[0])?'busy':'ok'}
function rqCard(r){const v=sv(r.svc),mv=r.type=='move',a=mv?S.appts.find(x=>x.id==r.aid):null,c=rqOk(r);
return `<div class="card"><div class="row2"><b>${esc(r.name)}</b><span class="chip new">Очікує підтвердження</span></div><div class="sm mu">${esc(r.phone)}</div>
<div class="row2" style="margin-top:10px"><span class="chip done">${mv?'Перенесення':'Новий запис'}</span><span class="sm mu">${cr(r.ago)}</span></div>
${mv?`<div class="cmp"><div><small>Зараз</small><b>${a?dl(a.o,a.time):'—'}</b></div><span>→</span><div><small>Бажано</small><b>${dl(r.o,r.t)}</b></div></div>`:`<div class="cmp"><div><small>Запис на</small><b>${dl(r.o,r.t)}</b></div></div>`}
<div class="row2 sm"><span>${esc(v.n)}</span><b class="price">${v.p} ₴</b></div>
${r.cm?`<div class="cq sm">💬 ${esc(r.cm)}</div>`:''}
${c=='busy'?`<div class="wn">Цей час уже зайнятий. Відхиліть запит або узгодьте інший час із клієнткою.</div>`:c=='gone'?`<div class="wn">Початковий запис уже недоступний. Відхиліть запит.</div>`:''}
<button class="btn" ${c=='ok'?'':'disabled'} onclick="rqAct(${r.id},1)">${mv?'Підтвердити перенесення':'Підтвердити запис'}</button><button class="btn ${c=='ok'?'g':''}" onclick="offerT(${r.id})">Запропонувати інший час</button><button class="btn g" style="color:var(--bad)" onclick="rqAct(${r.id},0)">Відхилити</button></div>`}
function reqs(){const p=S.reqs.filter(r=>r.st=='pending').sort((a,b)=>a.ago-b.ago),d=S.reqs.filter(r=>r.st!='pending'),n=p.length;
return `<div class="row2"><h1>Запити</h1>${n?`<span class="cnt" aria-label="Потребують дії">${n}</span>`:''}</div><p class="mu sm" style="margin:0 0 4px">${n?n+' '+pl(n,'запит потребує','запити потребують','запитів потребують')+' дії':'Нових запитів немає'}</p>
${n?p.map(rqCard).join(''):`<div class="card emp"><div class="ok">✓</div><h2>Усе опрацьовано</h2><p class="mu sm" style="margin:0">Нові запити від клієнток з’являтимуться тут.</p></div>`}
${d.length?`<h2 style="margin-top:18px">Опрацьовані</h2><div class="card" style="padding:4px 14px">${d.map(r=>`<div class="pr"><span><b>${esc(r.name)}</b><br><span class="sm mu">${r.st=='offer'?'Запропоновано '+dl(r.po,r.pt):(r.type=='move'?'Перенесення':'Новий запис')+' · '+dl(r.o,r.t)}</span></span><span class="chip ${r.st=='done'?'conf':r.st=='offer'?'new':'canc'}">${r.st=='done'?'Підтверджено':r.st=='offer'?'Очікує відповіді':'Відхилено'}</span></div>`).join('')}</div>`:''}`}
let LK=false;
function rqAct(id,ok){if(LK)return;LK=true;try{const r=S.reqs.find(x=>x.id==id);if(!r||r.st!='pending')return;
if(ok){const c=rqOk(r);if(c!='ok'){toast(c=='gone'?'Початковий запис уже недоступний':'Цей час уже зайнятий. Відхиліть запит або узгодьте інший час');render();return}
if(r.type=='move'){const a=S.appts.find(x=>x.id==r.aid);a.o=r.o;a.time=r.t;a.st='conf'}else S.appts.push({id:S.id++,o:r.o,time:r.t,svc:r.svc,name:r.name,phone:r.phone,st:'conf',paid:false,note:'',cm:r.cm});
r.st='done';toast(r.type=='move'?'Перенесення підтверджено':'Запис підтверджено')}
else{r.st='rej';toast('Запит відхилено')}
render()}catch(e){toast('Не вдалося виконати дію. Спробуйте ще раз.')}finally{LK=false}}
function svcs(){return `<div class="row2"><h1>Послуги</h1><button class="plus" aria-label="Додати послугу" onclick="svNew()">＋</button></div><p class="mu sm">Тривалість і ціна враховуються в онлайн-записі.</p>${SV.map(x=>`<div class="card"><div class="row2"><b>${esc(x.n)}</b><button class="tog ${x.off?"":"on"}" aria-label="Доступна для запису" onclick="svOff(${x.id})"></button></div>${x.desc?`<div class="sm mu" style="margin-top:4px">${esc(x.desc)}</div>`:""}<div class="row2 sm mu" style="margin-top:6px"><span>${x.d} хв${x.off?" · не показується клієнткам":""}</span><span class="price" style="color:var(--tx)">${x.p} ₴</span></div><button class="back" onclick="svEdit(${x.id})">Змінити</button></div>`).join("")}`}
function svNew(){svForm(0)}
function svEdit(id){svForm(id)}
function svForm(id){const x=id?sv(id):{n:"",d:60,p:"",desc:""};sheet(`<div class="row2" style="align-items:flex-start"><div><h2 style="margin-top:0">${id?"Редагувати послугу":"Нова послуга"}</h2><p class="mu sm" style="margin:0">${id?"Зміни одразу бачать клієнтки в онлайн-записі":"Вона одразу з’явиться в онлайн-записі"}</p></div><button class="xb" aria-label="Закрити" onclick="closeS()">✕</button></div><label class="f">Назва *</label><input id="sn" placeholder="Наприклад, укріплення нігтів" value="${esc(x.n)}"><div class="row2" style="gap:10px"><div style="flex:1;min-width:0"><label class="f">Тривалість, хв *</label><input id="sd" type="number" step="15" value="${x.d}"></div><div style="flex:1;min-width:0"><label class="f">Ціна, ₴ *</label><input id="spr" type="number" placeholder="600" value="${x.p}"></div></div><label class="f">Опис</label><textarea id="sx" placeholder="Коротко про послугу">${esc(x.desc||"")}</textarea><div class="row2" style="gap:10px;margin-top:14px"><button class="btn g" style="margin:0" onclick="closeS()">Скасувати</button><button class="btn" style="margin:0" onclick="svSave(${id})">${id?"Зберегти":"Додати послугу"}</button></div>`)}

function svOff(id){const x=sv(id);x.off=!x.off;render()}

function svSave(id){const n=$("#sn").value.trim(),d=+$("#sd").value,p=+$("#spr").value,t=$("#sx").value.trim();if(!n||!p||d<15){toast("Вкажіть назву, тривалість і ціну");return}if(id)Object.assign(sv(id),{n,d,p,desc:t});else SV.push({id:Math.max(...SV.map(x=>x.id))+1,n,d,p,desc:t});closeS();render();toast(id?"Збережено":"Послугу додано")}
const MNN=["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
function rng(){const d=D(S.day);if(S.view=="week"){const s=S.day-((d.getDay()+6)%7);return[s,s+6]}if(S.view=="month"){const s=S.day-d.getDate()+1;return[s,s+new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-1]}return[S.day,S.day]}
function calHead(){const[a,b]=rng(),L=S.appts.filter(x=>x.o>=a&&x.o<=b&&x.svc&&!['canc','noshow'].includes(x.st)),p=L.filter(x=>x.paid).reduce((s,x)=>s+sv(x.svc).p,0),n=L.filter(x=>x.st=='new').length;return `<div class="mini"><span>Оплачено: <b>${p} ₴</b></span><span>${n} чекають підтвердження</span></div><div class="seg vw">${[['day','День'],['week','Тиждень'],['month','Місяць']].map(v=>`<button class="${S.view==v[0]?'on':''}" onclick="S.view='${v[0]}';render()">${v[1]}</button>`).join('')}</div><div class="row2" style="margin:4px 2px 2px">${greet()}<button class="offb" onclick="offs()">Вихідні</button></div>`}
function mv(k){const d=D(S.day),t=new Date(d.getFullYear(),d.getMonth()+k,Math.min(d.getDate(),28));S.day=Math.round((t-D(0))/864e5);render()}
function cnav(){const w=S.view=='week',d=D(S.day),t=w?fd(rng()[0])+' – '+fd(rng()[1]):MNN[d.getMonth()]+' '+d.getFullYear();return `<div class="row2"><button class="back" aria-label="Назад" onclick="${w?'S.day-=7;render()':'mv(-1)'}">‹</button><h2 style="margin:0">${t}</h2><button class="back" aria-label="Далі" onclick="${w?'S.day+=7;render()':'mv(1)'}">›</button></div>`}
function weekV(){const a=rng()[0];let h=cnav();for(let i=0;i<7;i++){const o=a+i,l=S.appts.filter(x=>x.o==o&&x.st!='canc').sort((x,y)=>t2m(x.time)-t2m(y.time));h+=`<button class="card ap" onclick="S.day=${o};S.view='day';render()"><div class="t">${WD[D(o).getDay()]}<small>${D(o).getDate()}</small>${nOf(o)?`<em class="nb2">+${nOf(o)}</em>`:''}</div><div class="b">${isOff(o)?'<span class="mu sm">Вихідний</span>':l.map(x=>`<div class="sm"><span><b>${x.time}</b> ${esc(x.name)}</span><span class="chip ${x.st}">${ST[x.st]}</span></div>`).join('')||'<span class="mu sm">Вільно</span>'}</div></button>`}return h}
function monthV(){const d=D(S.day),f=S.day-d.getDate()+1,pad=(D(f).getDay()+6)%7,n=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();let c='';for(let i=0;i<pad;i++)c+='<span></span>';for(let i=0;i<n;i++){const o=f+i,k=S.appts.filter(x=>x.o==o&&x.svc&&x.st!='canc').length,nn=nOf(o);c+=`<button class="mc ${o==S.day?'on':''} ${o==0?'td':''} ${isOff(o)?'off':''}" onclick="S.day=${o};S.view='day';render()">${i+1}${k?`<i>${k-nn>0?k-nn:''}${nn?`<em>+${nn}</em>`:''}</i>`:''}</button>`}return cnav()+`<div class="mg">${['пн','вт','ср','чт','пт','сб','нд'].map(x=>`<small>${x}</small>`).join('')}${c}</div>`}
function cal(){return `<div class="${S.fx?'fx':''}">`+calHead()+(S.view=='week'?weekV():S.view=='month'?monthV():dayV())+`</div>`}
function isNew(a){return !!(a.client&&a.cat>=T0()&&a.st=='new'&&!a.seen)}
function nOf(o){return S.appts.filter(a=>a.o==o&&isNew(a)).length}
function newAll(){return S.appts.filter(isNew).sort((a,b)=>b.cat-a.cat)}
function greet(){const n=newAll().length;return n?`<span class="gr">Добрий день, Анно. <button class="lk" onclick="newList()">Подивитись нові записи <span aria-hidden="true">›</span></button></span>`:`<span class="mu">Добрий день, Анно</span>`}
function newList(){const l=newAll();if(!l.length){render();return}sheet(`<div class="row2" style="align-items:flex-start"><div><h2 style="margin-top:0">Нові записи</h2><p class="mu sm" style="margin:0">${l.length} ${pl(l.length,'запис надійшов','записи надійшли','записів надійшло')} сьогодні</p></div><button class="xb" aria-label="Закрити" onclick="closeS()">✕</button></div><div class="row2" style="margin:12px 0 4px"><span class="sm mu">Натисніть запис, щоб відкрити деталі</span><button class="gocal" onclick="goCal()">У календар <span aria-hidden="true">→</span></button></div>${l.map(a=>{const v=sv(a.svc);return `<button class="card ap" style="margin:8px 0" onclick="open_(${a.id})"><div class="b"><div><b>${esc(a.name)}</b><span class="chip ${a.st}">${ST[a.st]}</span></div><div class="sm mu">${esc(a.phone)}</div><div class="sm" style="margin-top:4px"><b>${dl(a.o,a.time)}</b> · ${esc(v.n)}</div>${a.cm?`<div class="cq sm">💬 ${esc(a.cm)}</div>`:''}<div class="sm mu" style="margin-top:4px">Надійшов: ${cr((Date.now()-a.cat)/6e4)}</div></div></button>`}).join('')}`)}

sheet(`<div class="row2" style="align-items:flex-start"><div><h2 style="margin-top:0">Вихідні</h2><p class="mu sm" style="margin:0">У ці дні клієнтки не бачать вільного часу.</p></div><div class="row2" style="gap:8px"><button class="plus" aria-label="Додати вихідні" onclick="offForm(0)">＋</button><button class="xb" aria-label="Закрити" onclick="closeS()">✕</button></div></div>

function offerT(id){const r=S.reqs.find(x=>x.id==id);if(!r||r.st!='pending')return;sheet(`<div class="row2" style="align-items:flex-start"><div><h2 style="margin-top:0">Інший час</h2><p class="mu sm" style="margin:0">${esc(r.name)} · ${esc(sv(r.svc).n)}</p></div><button class="xb" aria-label="Закрити" onclick="closeS()">✕</button></div><p class="sm mu" style="margin:8px 0 0">Бажаний час клієнтки: ${dl(r.o,r.t)}</p><div class="g2 dt"><div><label class="f">Дата</label><select id="fo" onchange="tFill('f',sv(${r.svc}).d,${r.aid||-1},1)"></select></div><div><label class="f">Година</label><select id="ft"></select></div></div><label class="f">Повідомлення клієнтці (за бажанням)</label><textarea id="fm" placeholder="Наприклад, цей час зайнятий, чи підійде інший?"></textarea><div class="row2" style="gap:10px;margin-top:14px"><button class="btn g" style="margin:0" onclick="closeS()">Скасувати</button><button class="btn" style="margin:0" onclick="offerSend(${id})">Надіслати</button></div>`);tFill('f',sv(r.svc).d,r.aid||-1,0,r.o,r.t)}

function cnav(){return `<nav class="nav"><div>${[['book','Записатись','<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4m8-4v4M3 9h18M12 13v4m-2-2h4"/>'],['prof','Профіль','<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>']].map(x=>`<button class="${S.ct==x[0]?'on':''}" onclick="S.ct='${x[0]}';render()"><svg viewBox="0 0 24 24">${x[2]}</svg>${x[1]}</button>`).join('')}</div></nav>`}
function hist(){if(!S.prof)return[];const k=S.prof.phone.replace(/\D/g,'');return S.appts.filter(a=>a.svc&&a.phone&&a.phone.replace(/\D/g,'')==k&&a.st!='canc').sort((a,b)=>b.o-a.o||t2m(b.time)-t2m(a.time))}

return `<h1>Профіль</h1><p class="mu">Необов’язково: запис без профілю працює так само. Збережіть дані, щоб не вводити їх щоразу.</p>
<div class="card"><div class="g2 np"><div><label class="f" style="margin-top:0">Ім’я *</label><input id="pn" value="${esc(p?p.name:'')}" autocomplete="name"></div><div><label class="f" style="margin-top:0">Телефон *</label><input id="pp" type="tel" value="${esc(p?p.phone:'')}" placeholder="+380"></div></div><label class="f">Email (за бажанням)</label><input id="pe" type="email" value="${esc(p&&p.email||'')}" autocomplete="email"><button class="btn" onclick="profSave()">${p?'Зберегти зміни':'Зберегти мої дані'}</button>${p?'<button class="back" style="margin-top:6px" onclick="profDel()">Видалити мої дані</button>':'<button class="back" style="margin-top:6px" onclick="profDemo()">Підставити демо-дані</button>'}</div>

`;

sheet(`<h2>Звільнилось вікно ${a.time}</h2><p class="mu sm">${wd(a.o)}, ${fd(a.o)}. Оберіть, кому запропонувати — повідомлення піде лише вибраним.</p>${c.map(w=>`<label class="card row2" style="cursor:pointer"><span><b>${esc(w.name)}</b><br><span class="sm mu">Хоче: ${wd(w.o)}, ${w.rng}</span></span><input type="checkbox" class="wc" style="width:22px;height:22px" ${w.o==a.o?"checked":""}></label>`).join("")}
<button class="btn" onclick="sendOffer()">Запропонувати вибраним</button><button class="btn g" onclick="closeS()">Не пропонувати</button>`)}
function sendOffer(){const n=[...document.querySelectorAll(".wc")].filter(x=>x.checked).length;closeS();toast(n?`Пропозицію надіслано: ${n} (демо)`:"Нікого не вибрано")}
function quick(){sheet(`<h2>Новий запис</h2>
<div class="g2 np"><div><label class="f">Ім’я</label><input id="qn" placeholder="Ім’я клієнтки" autofocus></div><div><label class="f">Телефон</label><input id="qp" type="tel" placeholder="+380" autocomplete="off"></div></div>
<label class="f">Послуга (можна пізніше)</label><select id="qs" onchange="qFill()">${SV.map(s=>`<option value="${s.id}">${esc(s.n)}</option>`).join("")}<option value="0">Заблокувати час (30 хв)</option></select>
<div class="g2 dt"><div><label class="f">Дата</label><select id="qd" onchange="qFill(1)"></select></div><div><label class="f">Година</label><select id="qt"></select></div></div>
<p class="sm mu" style="margin:6px 2px 0">Сірим позначено вихідні й зайнятий час.</p>
<label class="f">Нотатки для себе</label><textarea id="qm" placeholder="Наприклад, дизайн або побажання"></textarea>
<button class="btn" onclick="addQ()">Додати</button>`);qFill(0,S.day)}
function qFill(only,init){const sid=+$("#qs").value,d=sid?sv(sid).d:30,ds=$("#qd");
if(!only){const cur=init!=null?init:+ds.value;ds.innerHTML=[...Array(14)].map((_,o)=>{const sl=slots(o,d),off=isOff(o),bad=off||!sl.some(x=>x.f);return `<option value="${o}" ${bad?'disabled style="color:#a9a3b8"':""}>${wd(o)}, ${fd(o)}${off?" · вихідний":bad?" · зайнято":""}</option>`}).join("");ds.value=cur;if(!ds.selectedOptions[0]||ds.selectedOptions[0].disabled){const f=[...ds.options].find(x=>!x.disabled);if(f)ds.value=f.value}}
const sl=slots(+ds.value,d),ts=$("#qt"),cur=ts.value;ts.innerHTML=sl.map(x=>`<option value="${x.t}" ${x.f?"":'disabled style="color:#a9a3b8"'}>${x.t}${x.f?"":" · зайнято"}</option>`).join("");ts.value=cur;if(!ts.value||!ts.selectedOptions[0]||ts.selectedOptions[0].disabled){const f=sl.find(x=>x.f);if(f)ts.value=f.t}}
function addQ(){const n=$("#qn").value.trim(),o=+$("#qd").value,t=$("#qt").value,s=+$("#qs").value;if(!s==false&&!n){toast("Вкажіть ім’я");return}
const d=s?sv(s).d:30,m=t2m(t);if(busy(o).some(b=>m<b[1]&&m+d>b[0])||m<540||m+d>1200){toast("Цей час недоступний");return}
S.appts.push({id:S.id++,o,time:t,svc:s||null,dur:30,name:s?n:"Блок",phone:s?$("#qp").value.trim():"",st:s?"conf":"block",paid:false,note:s?$("#qm").value.trim():""});closeS();S.day=o;render();toast(s?"Запис додано":"Час заблоковано")}
function clients(){const m={};S.appts.filter(a=>a.svc&&a.phone).forEach(a=>{(m[a.phone]=m[a.phone]||{name:a.name,phone:a.phone,v:[]}).v.push(a)});
const q=S.q.toLowerCase(),l=Object.values(m).filter(c=>c.name.toLowerCase().includes(q)||c.phone.replace(/\s/g,"").includes(q.replace(/\s/g,"")));
return `<h1>Клієнти</h1><input id="q" placeholder="Пошук за ім’ям або телефоном" value="${esc(S.q)}" oninput="S.q=this.value;const p=this.selectionStart;render();const e=$('#q');e.focus();e.setSelectionRange(p,p)">
${l.map(c=>`<button class="card ap" onclick="cli('${c.phone}')"><div class="b"><div><b>${esc(c.name)}</b><span class="sm mu">${c.v.filter(a=>a.st=="done").length} візитів</span></div><div class="sm mu">${c.phone}</div></div></button>`).join("")||`<div class="brk" style="margin-top:12px">Нікого не знайдено. Спробуйте частину номера.</div>`}`}
function cli(p){const v=S.appts.filter(a=>a.phone==p&&a.svc).sort((a,b)=>b.o-a.o),c=v[0];sheet(`<h2>${esc(c.name)}</h2><p class="mu" style="margin:0">${p}</p><label class="f">Історія візитів</label>${v.map(a=>`<div class="card row2"><span><b>${sv(a.svc).n}</b><br><span class="sm mu">${a.o<0?-a.o+" дн. тому":wd(a.o)+", "+fd(a.o)} · ${a.time}</span></span><span class="chip ${a.st}">${ST[a.st]}</span></div>`).join("")}${v.find(a=>a.note)?`<div class="card sm">📝 ${esc(v.find(a=>a.note).note)}</div>`:""}<button class="btn" onclick="closeS();S.tab='cal';quick();$('#qn').value='${esc(c.name)}';$('#qp').value='${p}'">Створити запис</button>`)}
function nextAp(){return S.appts.filter(a=>a.svc&&a.o>=0&&["new","conf"].includes(a.st)).sort((a,b)=>a.o-b.o||t2m(a.time)-t2m(b.time))[0]}
function rem(){const a=nextAp();return `<h1>Нагадування</h1><p class="mu sm">Так клієнтка бачить повідомлення в Telegram. Натисніть кнопку — календар оновиться.</p>
${a?`<div class="tg"><div class="sm" style="margin-bottom:6px">Нагадування для: <b>${esc(a.name)}</b></div><div class="m">За годинку вже творимо красу 💅 Чекаю на тебе о ${a.time}! Підтверджуєш, що все в силі?</div><div class="k"><button onclick="reply(${a.id},'conf')">Підтверджую</button><button onclick="reply(${a.id},'canc')">Не зможу прийти</button></div></div>
<p class="sm mu">Зараз: <span class="chip ${a.st}">${ST[a.st]}</span> · ${wd(a.o)}, ${a.time}</p>`:`<div class="brk">Немає майбутніх записів для нагадування.</div>`}
<h2 style="margin-top:18px">Коли нагадувати</h2><div class="card row2"><span>За 1 годину<br><span class="sm mu">за замовчуванням</span></span><button class="tog on" aria-label="За годину" disabled></button></div>
<div class="card row2"><span>За 24 години</span><button class="tog ${S.rem24?"on":""}" aria-label="За 24 години" onclick="S.rem24=!S.rem24;render()"></button></div>
<p class="sm mu">Спершу Telegram. Viber перевіряємо окремо.</p>`}
function reply(id,s){const a=S.appts.find(x=>x.id==id);a.st=s;render();if(s=="canc"){toast(a.name+" не зможе прийти");offer(a)}else toast(a.name+" підтвердила візит")}
render();
(function(){const sp=document.getElementById('sp');if(!sp)return;const tb=sp.querySelector('.tb'),c=document.getElementById('spc'),x=c.getContext('2d'),rm=matchMedia('(prefers-reduced-motion:reduce)').matches,dp=Math.min(devicePixelRatio||1,2);let W,H,done=false,raf;
function rs(){W=innerWidth;H=innerHeight;c.width=W*dp;c.height=H*dp;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dp,0,0,dp,0,0)}rs();
const CL=['#ffffff','#ff7fae','#a98bf0'],st=[...Array(48)].map((_,i)=>({x:Math.random(),y:.5+(Math.random()-.5)*(Math.random()<.7?.26:.9),r:3+Math.random()*8,p:Math.random()*6.28,s:1.4+Math.random()*2.4,d:Math.random()*2200,c:CL[i%3]}));
function star(px,py,r,a,col){x.save();x.translate(px,py);x.globalAlpha=a;x.fillStyle=col;x.shadowColor=col;x.shadowBlur=r*2.2;x.beginPath();for(let i=0;i<8;i++){const q=i%2?r*.22:r,an=i*Math.PI/4;x.lineTo(Math.cos(an)*q,Math.sin(an)*q)}x.closePath();x.fill();x.restore()}
const t0=performance.now();
function fr(t){const e=t-t0;x.clearRect(0,0,W,H);st.forEach(s=>{const k=Math.min(1,Math.max(0,(e-500-s.d)/700)),w=.5+.5*Math.sin(e/1000*s.s+s.p);if(k*w>.03)star(s.x*W,s.y*H,s.r*(.55+.45*w),k*w,s.c)});if(!done&&!rm)raf=requestAnimationFrame(fr)}
function fin(){if(done)return;done=true;cancelAnimationFrame(raf);sp.classList.add('out');setTimeout(()=>sp.remove(),800)}
addEventListener('resize',rs);sp.addEventListener('click',fin);
if(rm){fr(t0+3500)}else{requestAnimationFrame(fr)}
setTimeout(()=>tb.classList.add('go'),rm?0:400);setTimeout(fin,rm?2200:4400)})();
</script></body></html>
